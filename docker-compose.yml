services:
  api:
    build:
      context: .
      dockerfile: src/EquityLens.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ApiProviderOptions__Mode: Live
      ApiProviderOptions__MarketDataProvider: YahooFinance
      ApiProviderOptions__SecUserAgent: EquityLens Research Dashboard contact@example.com
      ConnectionStrings__EquityLens: Data Source=/app/data/equitylens.db
    ports:
      - "5077:8080"
    volumes:
      - equitylens-data:/app/data

  web:
    build:
      context: .
      dockerfile: src/EquityLens.Web/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:5077
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  equitylens-data:
