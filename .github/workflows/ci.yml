name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET dependencies
        run: dotnet restore EquityLens.sln

      - name: Build .NET solution
        run: dotnet build EquityLens.sln --configuration Release --no-restore

      - name: Test .NET solution
        run: dotnet test EquityLens.sln --configuration Release --no-build --verbosity normal

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/EquityLens.Web/package-lock.json

      - name: Install web dependencies
        working-directory: src/EquityLens.Web
        run: npm ci

      - name: Build web app
        working-directory: src/EquityLens.Web
        run: npm run build
